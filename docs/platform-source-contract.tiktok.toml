# TikTok source contract. Public discovery uses the signed Web API backend;
# account behavior (likes/favorites/following bootstrap and incremental sync) and
# native save run as browser tasks inside the user's signed-in browser.

schema_version = 1
canonical_slug = "tiktok"
display_name = "TikTok"
integration_level = "full"
aliases = []
hosts = ["tiktok.com"]
content_types = ["video"]

[transport]
kind = "hybrid"
owner = "shared"
entrypoints = [
  "src/openbiliclaw/sources/tiktok_web.py",
  "src/openbiliclaw/sources/tiktok.py",
  "src/openbiliclaw/sources/tiktok_tasks.py",
  "extension/src/background/tiktok-task-dispatcher.ts",
  "extension/src/content/tt/task-executor.ts",
  "extension/src/content/native-save/tiktok.ts",
]
route_aliases = []
fallback_owner = "external-cli"
requires_overseas_network = true
routed_by_network_mode = true
network_policy = "Signed curl_cffi and yt-dlp follow shared outbound network routing for discovery. Account tasks and native save use the user's signed-in browser network stack; the backend does not replay credentials for account tasks or native save."

[transport.capability_routes]
discover = "backend:signed-web-api:guest-or-cookie"
profile = "extension:browser-task:session-read-only"
bootstrap = "extension:browser-task:session-read-only"
incremental = "extension:browser-task:session-read-only"
native-save = "extension:browser-task:login-required"
cookie-sync = "extension:unified-credential:passport-probe"

[identity]
item_id = "TikTok numeric video id; item_key=tiktok:<id>"
url = "https://www.tiktok.com/@<handle>/video/<id>"
dedupe = "Canonical tiktok family plus video id; personal event keys are additionally partitioned by interaction scope"
account_scope = "Account behavior tasks require a positively observed signed-in viewer in the owned browser tab and a backend profile-account fence; these claims are observed, not passport-verified account identity; unknown or logged-out tabs fail closed"

[auth]
mode = "capability-specific"
credential_kinds = ["cookie"]
verify_action = "live_probe"
write_path = "unified"
account_resolution = "Environment cookie precedes data-file cookie for discovery; account tasks observe the current browser viewer; backend uses a stable normalized-handle hash plus optional secUid hash conflict guard, tolerates missing/new secUid for the same handle, freezes first profile account binding and rejects handle or known-secUid switches without mixing profile data"
identity_evidence = "Passport heartbeat confirms a session for discovery search; account-task evidence is the signed-in profile marker observed in the task tab, never cookie presence alone"
login_cookie_names = ["sessionid", "sessionid_ss", "sid_tt"]
login_state_path = "credential"

[auth.capability_modes]
discover = "optional-credential"
profile = "login-required"
bootstrap = "login-required"
incremental = "login-required"
native-save = "login-required"
cookie-sync = "login-required"

[auth.capability_required]
discover = true
profile = true
bootstrap = true
incremental = true
native-save = true
cookie-sync = false

[upstream]
success_content_types = ["application/json"]
pagination = "Discovery stays bounded first-page snapshots. Default account scopes are likes/favorites/following, collected by bounded DOM scrolling with explicit terminal evidence. Watch history is optional, explicit-task-only because the current desktop UI has no entry; user waived history acceptance on 2026-10-13"
terminal_evidence = "HTTP 200, business status zero and explicit itemList/item_list array for discovery; account scopes require an explicit has_more=false/cursor exhaustion or the recognized logged-in empty state; only explicit empty means empty"
terminal_policy = "429 persists shared cooldown; auth/error/schema/gate/transport failures are not empty. Login walls and logged-out task tabs are failed, never valid-empty"
partial_policy = "Retain successful query candidates and accepted rows; mark only failed query claims failed. Interrupted account pagination keeps partial rows and the scope stays incomplete; no retraction inference"
publication_time_policy = "createTime epoch UTC; no discovered-time substitution"

[discover]
modes = ["feed", "tag", "user", "search"]
search_generation = "Merged planner and inspiration axis; guest phrases compact to hashtags; cookie search keeps phrases"
budget = "Daily feed calls independent of per-pull size; search/tag claim bounded by remaining execution units"
cursor = "First-page snapshot; no completeness or retraction inference"

[profile]
signals = true
incremental = true
refresh_mode = "incremental"

[extension]
# Site access is declared in required host_permissions in all three manifests;
# source enablement and browser-level access restrictions remain independent.
task = "browser-task"
hosts = ["tiktok.com"]
task_marker = true
background = true
early_response = true
cookie_sync = true

[surfaces]
cli = true
setup = true
desktop = true
mobile = true
# Shared product policy: mobile consumes recommendations/saves, not credentials.
mobile_credentials = false
mobile_source_settings = false
mobile_verify = false
extension_popup = true
source_status = true
credentials = true
recommendation = true

[engagement]
view = "mapped"
like = "mapped"
favorite = "mapped"
comment = "mapped"
share = "mapped"
danmaku = "unavailable"

[media]
image = "proxy"
image_hosts = ["tiktokcdn.com", "tiktokcdn-us.com", "tiktokcdn-eu.com"]
deep_link = "browser-fallback"
native_save = true

[e2e]
safe_actions = ["feed", "search", "fetch-public-collection", "read-identity", "snapshot"]
mutating_actions = ["platform-save-favorite"]

[e2e.safe_assertions]
feed = "upstream-state-unchanged"
search = "upstream-state-unchanged"
fetch-public-collection = "upstream-state-unchanged"
read-identity = "upstream-state-unchanged"
snapshot = "upstream-state-unchanged"

[e2e.safe_postconditions]
feed = "Read-only public metadata into isolated storage; no likes, saves, follows or production writes."
search = "Read-only public metadata into isolated storage; no likes, saves, follows or production writes."
fetch-public-collection = "Read-only public metadata into isolated storage; no likes, saves, follows or production writes."
read-identity = "Only same-origin session/profile-marker reads cross the task boundary; no raw credentials or upstream mutation."
snapshot = "Read-only observation of the signed-in account's liked videos, favorites and followed accounts (watch history only when explicitly requested and exposed) into isolated storage; the extension never reconstructs engagement POSTs and no upstream mutation is invoked."

[events]
strategy_prefixes = ["tiktok_"]
mappings = "Discovery candidates plus profile events: liked videos map to like, favorited/collected videos map to favorite, optional explicit watch-history tasks map to view, followed accounts map to follow. Guided init and periodic sync request only likes/favorites/following; absence of history is not a failure for these default tasks. Feed impressions never become profile events."
scope_caps = "Per-query result cap and per-source execution budgets for discovery; account scopes carry frozen item/page caps set at admission and remain incomplete when capped"

[task]
lease = "Backend atomic leasing and the cross-source extension mutex prevent a second active TikTok task from being claimed; stale claims recover the first staged result"
idle_deadline = "A durable idle deadline advances only on accepted progress and survives worker restarts"
absolute_deadline = "A durable absolute deadline bounds navigation, observation, parsing, and paginated reads across restarts"
retry = "The exact canonical task-result payload is persisted before POST and retried with bounded backoff until a 2xx ACK or explicit terminal rejection; backend first-final-wins remains authoritative. Two-stage staged completion freezes the first canonical payload in a single write transaction before event ingress replay"
buffer = "Only bounded normalized rows, cursors, task/claim/tab identity, deadlines, and the pending result are stored locally until ACK; raw response bodies and Cookie/CSRF values are never buffered or transmitted"

[smoke]
storage_scope = "isolated-only"

[smoke.sinks]
task = "allowed"
task_result = "allowed"
seen = "forbidden"
affinity = "forbidden"
snapshot = "forbidden"
schedule = "forbidden"
event_ingress = "forbidden"
memory = "forbidden"
profile = "forbidden"

[exclusions]
"engagement.danmaku" = "TikTok has no danmaku metric."
"media.deep-link" = "Canonical HTTPS browser fallback."

[exclusion_tests]
"engagement.danmaku" = ["tests/test_tiktok_contract.py::test_tiktok_engagement_danmaku_is_unavailable"]
"media.deep-link" = ["tests/test_tiktok_contract.py::test_tiktok_media_deep_link_uses_https"]
