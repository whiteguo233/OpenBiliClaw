schema_version = 1
canonical_slug = "zhihu"
display_name = "知乎 native-save confirmation"
integration_level = "capability-increment"
aliases = ["zh", "知乎"]
hosts = ["zhihu.com"]
content_types = ["question", "answer", "article"]

[transport]
kind = "browser-task"
owner = "extension"
entrypoints = [
  "extension/src/background/native-save-task-runner.ts",
  "extension/src/background/zhihu-task-dispatcher.ts",
  "extension/src/content/native-save/runtime.ts",
  "extension/src/content/native-save/zhihu.ts",
]
route_aliases = []
fallback_owner = "none"
requires_overseas_network = false
routed_by_network_mode = false
network_policy = "The real write and read-only confirmation use the signed-in browser network stack; no backend cookie replay or proxy route owns this capability."

[transport.capability_routes]
native-save = "extension:browser-task:login-required"
cookie-sync = "extension:cookie-sync:boolean-login-state"

[identity]
item_id = "Typed public id question:<id>, answer:<id>, or article:<id>; item key zhihu:<typed_id>."
url = "Exact HTTPS zhihu.com question/answer URL or zhuanlan.zhihu.com article URL validated against the typed id."
dedupe = "Canonical zhihu family plus typed public id and requested action in the durable native-save ledger."
account_scope = "The account currently signed in to the one verified installed extension browser."

[auth]
mode = "login-required"
credential_kinds = ["login_state"]
verify_action = "browser_heartbeat"
write_path = "unified"
account_resolution = "The content executor requires the exact rendered Zhihu item, one visible global favorite control, and no visible login overlay in the task tab; the heartbeat remains only a readiness hint."
identity_evidence = "A fresh exact task-result callback carries DOM proof that the item-level global favorite control is persisted as 已收藏; neither a cookie-name heartbeat nor historical task success proves that state."
login_cookie_names = ["z_c0"]
login_state_path = "callback"

[auth.capability_modes]
native-save = "login-required"
cookie-sync = "optional-credential"

[auth.capability_required]
native-save = true
cookie-sync = false

[upstream]
success_content_types = ["text/html"]
pagination = "N/A: one exact public item and one exact global favorite control are inspected per task."
terminal_evidence = "The exact item-level control transitions from 收藏 to 已收藏 after one mutation, or the same control is already 已收藏 in a different reloaded document instance."
terminal_policy = "Only positive persisted global-favorite state proves success; missing confirmation remains native_confirmation_not_observed. An 已收藏 control is never clicked."
partial_policy = "N/A: the task is atomic for one item/action/target and never reports partial success."
publication_time_policy = "N/A: native-save confirmation does not read or synthesize publication time."

[discover]
modes = []
search_generation = "Outside this capability increment; existing Zhihu discovery is unchanged."
budget = "Outside this capability increment."
cursor = "Outside this capability increment."

[profile]
signals = false
incremental = false
refresh_mode = "none"

[extension]
task = "browser-task"
hosts = ["zhihu.com"]
task_marker = false
background = true
early_response = false
cookie_sync = true

[surfaces]
cli = true
setup = false
desktop = true
mobile = true
extension_popup = true
source_status = true
credentials = true
recommendation = true

[engagement]
view = "unavailable"
like = "unavailable"
favorite = "unavailable"
comment = "unavailable"
share = "unavailable"
danmaku = "unavailable"

[media]
image = "none"
image_hosts = []
deep_link = "browser-fallback"
native_save = true

[e2e]
safe_actions = ["navigate-public-item"]
mutating_actions = ["platform-save-favorite", "platform-save-watch-later"]

[e2e.safe_assertions]
navigate-public-item = "upstream-state-unchanged"

[e2e.safe_postconditions]
navigate-public-item = "Opening the exact public Zhihu item performs no account-state mutation."

[events]
strategy_prefixes = ["zhihu-", "zhihu_"]
mappings = "Native-save task tabs suppress the passive collector; executor clicks produce no behavior events."
scope_caps = "One exact item/action/target per fresh authorization envelope."

[task]
lease = "Backend durable native-save lease; one runner-owned tab is recorded in chrome.storage.session."
idle_deadline = "Readiness, document READY probes, mutation, and result callbacks are independently bounded."
absolute_deadline = "One backend-owned task deadline plus a bounded three-attempt result ACK budget."
retry = "Mutation executes once; only read-only verification may follow. Exact callback payload replays are idempotently acknowledged."
buffer = "Runner opens about:blank, records tab ownership before navigation, and suppresses passive collection on initial load/reload."

[smoke]
storage_scope = "isolated-only"

[smoke.sinks]
task = "allowed"
task_result = "allowed"
seen = "forbidden"
affinity = "forbidden"
snapshot = "forbidden"
schedule = "forbidden"
event_ingress = "forbidden"
memory = "forbidden"
profile = "forbidden"

[exclusions]
"discover.formal" = "Existing Zhihu discovery is outside this native-save confirmation increment."
"search.integration" = "Existing Zhihu keyword generation and search are unchanged by this increment."
"profile.signals" = "Existing Zhihu profile bootstrap is outside this increment."
"profile.incremental" = "Existing Zhihu incremental refresh is outside this increment."
"profile.refresh-mode" = "This scoped contract claims only native-save confirmation, not profile refresh."
"extension.task-marker" = "Runner-owned tab identity is established before navigation through a background tab-id handshake, not a URL marker."
"extension.early-response" = "Native-save uses rendered DOM state and a document READY handshake, not early response capture."
"surface.setup" = "Guided setup remains the existing discovery/bootstrap flow and exposes no native-save confirmation control."
"media.image" = "This increment neither fetches nor displays media images."
"media.deep-link" = "This increment opens the canonical web URL and claims no mobile native-app scheme."
"engagement.view" = "This scoped native-save path does not normalize engagement counters."
"engagement.like" = "This scoped native-save path does not normalize engagement counters."
"engagement.favorite" = "Persisted item-level global-favorite state is task proof, not a recommendation favorite_count metric."
"engagement.comment" = "This scoped native-save path does not normalize engagement counters."
"engagement.share" = "This scoped native-save path does not normalize engagement counters."
"engagement.danmaku" = "This scoped native-save path does not normalize engagement counters."

[exclusion_tests]
"discover.formal" = ["tests/test_native_save_confirmation_contract.py::test_zhihu_native_save_contract_excludes_formal_discover"]
"search.integration" = ["tests/test_native_save_confirmation_contract.py::test_zhihu_native_save_contract_excludes_search_integration"]
"profile.signals" = ["tests/test_native_save_confirmation_contract.py::test_zhihu_native_save_contract_excludes_profile_signals"]
"profile.incremental" = ["tests/test_native_save_confirmation_contract.py::test_zhihu_native_save_contract_excludes_profile_incremental"]
"profile.refresh-mode" = ["tests/test_native_save_confirmation_contract.py::test_zhihu_native_save_contract_excludes_profile_refresh_mode"]
"extension.task-marker" = ["tests/test_native_save_confirmation_contract.py::test_zhihu_native_save_contract_excludes_task_marker"]
"extension.early-response" = ["tests/test_native_save_confirmation_contract.py::test_zhihu_native_save_contract_excludes_early_response"]
"surface.setup" = ["tests/test_native_save_confirmation_contract.py::test_zhihu_native_save_contract_excludes_setup_surface"]
"media.image" = ["tests/test_native_save_confirmation_contract.py::test_zhihu_native_save_contract_excludes_media_image"]
"media.deep-link" = ["tests/test_native_save_confirmation_contract.py::test_zhihu_native_save_contract_excludes_media_deep_link"]
"engagement.view" = ["tests/test_native_save_confirmation_contract.py::test_zhihu_native_save_contract_excludes_engagement_view"]
"engagement.like" = ["tests/test_native_save_confirmation_contract.py::test_zhihu_native_save_contract_excludes_engagement_like"]
"engagement.favorite" = ["tests/test_native_save_confirmation_contract.py::test_zhihu_native_save_contract_excludes_engagement_favorite"]
"engagement.comment" = ["tests/test_native_save_confirmation_contract.py::test_zhihu_native_save_contract_excludes_engagement_comment"]
"engagement.share" = ["tests/test_native_save_confirmation_contract.py::test_zhihu_native_save_contract_excludes_engagement_share"]
"engagement.danmaku" = ["tests/test_native_save_confirmation_contract.py::test_zhihu_native_save_contract_excludes_engagement_danmaku"]
