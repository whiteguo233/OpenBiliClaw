<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>来源登录 · OpenBiliClaw</title>
<style>
*{box-sizing:border-box}body{font:16px system-ui,sans-serif;background:#f6f7fb;color:#202635;margin:0;padding:24px}main{max-width:1100px;margin:auto}h1{font-size:24px}p{line-height:1.6}button,input,select{font:inherit;padding:10px;border:1px solid #ccd2dd;border-radius:8px;max-width:100%;min-width:0}button{cursor:pointer;background:white;overflow-wrap:anywhere}button.primary{background:#405ddd;color:white;border-color:#405ddd}button:disabled{opacity:.5;cursor:wait}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}#screen{display:block;width:100%;border-radius:12px;border:1px solid #ccd2dd;background:white}#status{min-height:24px}#fields{width:360px;max-width:100%}a{color:#405ddd}.hint{color:#616b7c;font-size:14px}
</style>
<main><h1>登录这个内容来源</h1>
<p>在下方网站画面点击、扫码或完成验证。登录状态保存在运行 OpenBiliClaw 的设备上，完成后继续试跑发现流程。</p>
<p id="status" role="status">正在打开登录窗口…</p>
<div class="controls"><button id="refresh">刷新画面</button><button data-key="Tab">下一个输入框</button><button data-key="Enter">回车</button><button id="resume" class="primary">登录完成，继续试跑</button></div>
<div id="login-origins" class="controls" aria-label="网站请求的登录页面"></div>
<img id="screen" alt="网站登录画面，点击可操作" hidden>
<div class="controls"><select id="fields" aria-label="选择网站输入框"></select><input id="value" type="password" autocomplete="off" aria-label="输入内容" placeholder="在此输入选中字段的内容"><button id="fill">填入网站</button></div>
<p class="hint">输入内容只发送到当前网站窗口。窗口最多保持 15 分钟；过期后可重新打开。</p>
<p><a href="/web/">返回 OpenBiliClaw</a></p></main>
<script type="module">
const draftId=new URLSearchParams(location.search).get('draft_id');
const status=document.querySelector('#status'),screen=document.querySelector('#screen'),fields=document.querySelector('#fields');
const base=`/api/custom-sources/drafts/${encodeURIComponent(draftId||'')}`;
let lastImage='',busy=false,closed=false;
async function request(path,body){const r=await fetch(base+path,{method:body===undefined?'GET':'POST',credentials:'same-origin',cache:'no-store',headers:body===undefined?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});if(!r.ok){let message='操作失败';try{message=(await r.json()).detail||message}catch{}if(r.status===401)message='请先在此浏览器登录 OpenBiliClaw，再重新打开来源登录。';throw new Error(message)}return r}
function renderOrigins(origins){const container=document.querySelector('#login-origins');container.replaceChildren();for(const origin of origins||[]){const button=document.createElement('button');button.textContent=`允许此登录页面：${origin}`;button.addEventListener('click',()=>operate(()=>open(origin)));container.append(button)}}
function render(snapshot){renderOrigins(snapshot.blocked_navigation_origins);const selected=fields.value;fields.replaceChildren();for(const e of snapshot.elements||[]){if(e.tag?.toLowerCase()!=='input'||!e.selector||['hidden','submit','button'].includes(e.type))continue;const option=document.createElement('option');option.value=e.selector;option.textContent=e.text||e.selector;fields.append(option)}if([...fields.options].some(o=>o.value===selected))fields.value=selected}
async function screenshot(){if(closed)return;const blob=await(await request('/screenshot')).blob();if(lastImage)URL.revokeObjectURL(lastImage);lastImage=URL.createObjectURL(blob);screen.src=lastImage;screen.hidden=false}
async function operate(fn){if(busy)return;busy=true;try{await fn()}catch(e){status.textContent=e.message}finally{busy=false}}
async function act(action){render(await(await request('/action',action)).json());await screenshot()}
screen.addEventListener('click',event=>operate(async()=>{const bounds=screen.getBoundingClientRect();await act({action:'click',x:(event.clientX-bounds.left)*screen.naturalWidth/bounds.width,y:(event.clientY-bounds.top)*screen.naturalHeight/bounds.height})}));
document.querySelectorAll('[data-key]').forEach(button=>button.addEventListener('click',()=>operate(()=>act({action:'key',key:button.dataset.key}))));
document.querySelector('#fill').addEventListener('click',()=>operate(async()=>{const input=document.querySelector('#value');const value=input.value;input.value='';await act({action:'fill',selector:fields.value,value})}));
document.querySelector('#refresh').addEventListener('click',()=>operate(screenshot));
document.querySelector('#resume').addEventListener('click',()=>operate(async()=>{closed=true;status.textContent='正在试跑…';let result;try{result=await(await request('/resume',{})).json()}catch(error){closed=false;try{await open()}catch{}throw error}status.textContent=result.status==='ready'?'试跑成功。已有来源已恢复；新来源请返回聊天确认启用。':result.detail||'仍需完成网站验证。';if(result.status!=='ready'){closed=false;await open()}}));
async function open(loginOrigin=''){if(!draftId)throw new Error('缺少来源草稿 ID');const draft=await(await request('')).json();renderOrigins(draft.suggested_login_origins);const snapshot=await(await request('/takeover',loginOrigin?{login_origin:loginOrigin}:{})).json();render(snapshot);status.textContent=(snapshot.blocked_navigation_origins||[]).length?'网站需要跳转到另一个登录页面，请确认下方地址后继续。':'请在网站画面完成登录。';await screenshot()}
await operate(open);setInterval(()=>{if(!closed&&!busy)operate(screenshot)},4000);
</script></html>
