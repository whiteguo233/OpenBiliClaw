# OpenBiliClaw configuration example
# Copy this file to config.toml and edit as needed.
# 首次运行如果缺少 config.toml，程序会自动基于本文件生成模板。
# 使用远程模型（OpenAI / Claude / Gemini / DeepSeek / OpenRouter）时，需要为调用链中的实例填写 api_key。
# 本地 Ollama 主要用于向量检索（embedding, bge-m3）。作为聊天 provider 属高级用法：
# 捆绑的 Ollama 只装了 embedding 模型，小体积本地聊天模型达不到内容管线质量线，
# 因此图形向导 / init / bootstrap 都不再推荐把它当聊天默认。确要如此的高级用户可手动
# 新建一个 provider_type = "ollama" 的实例，并把实例 ID 放入 default_chain。

[general]
# Language for Agent output (zh / en)
language = "zh"
# Data directory (relative to project root)
data_dir = "data"

[api]
# 后端 API 监听地址。
# "0.0.0.0" = 绑定所有网卡（默认），同局域网手机可通过 /m/ 访问移动端 Web。
# "127.0.0.1" = 仅本机可访问，更安全但手机扫码打不开。
host = "0.0.0.0"
# 后端 API 监听端口。
port = 8420

# 局域网/远程访问的可选密码门禁。本机（127.0.0.1 直连）默认始终免登录。
[api.auth]
# 是否开启密码登录门禁。
enabled = false
# 密码哈希（scrypt）。请勿手填明文；用 `openbiliclaw set-password` 或 init 设置。
password_hash = ""
# 登录态签名密钥，首次启用自动生成，请勿外泄。
session_secret = ""
# 登录态有效期（小时）。0 = 永不过期（默认，需登出/改密才失效）；填 >0 改为限时。
session_ttl_hours = 0
# 本机请求是否免登录（扩展/CLI 依赖此项）。设 false 则连本机也要登录。
# 注意：带代理转发头(X-Forwarded-For 等)的请求不算本机，仍需登录。
trust_loopback = true
# 受信任的前置/同机反向代理 IP 列表。仅当直接对端命中此列表，才采信 X-Forwarded-For
# 解析真实客户端 IP（从右向左）。留空(默认)= 永不采信转发头。同机反代必须配置此项。
trusted_proxies = []
# 允许「跨源 Bearer 登录」的 Origin 白名单（如桌面端从另一 origin 访问后端）。
# 默认空 = 只允许同源 Cookie 登录，绝不向 JS 返回 token。
allowed_bearer_origins = []

# 扩展设备访问默认关闭。启用后仅接受下方已配置设备密钥签发的访问令牌。
extension_access_enabled = false
# 扩展设备密钥摘要记录（<12 位 key ID>:<SHA-256 digest>）；不要填入完整密钥。
extension_access_keys = []
# 扩展设备访问令牌有效期（小时），允许范围 1..168，默认 24。
extension_token_ttl_hours = 24

[llm]
# v2：每个实例都是完整可调用端点（类型 + Base URL + 凭据 + 模型）。
# default_chain 从左到右依次尝试；失败、超时或限流时降级到下一实例。
# 可复制任意 [llm.instances.<id>] 表并换一个稳定 ID，从而配置同类型的多个账号/网关。
routing_version = 2
default_chain = ["deepseek"]
# Shared max concurrency for LLM requests. Higher values replenish faster but
# may hit provider/local-proxy rate limits sooner.
# 总并发 4；后台派生为 3
concurrency = 4
# Global request timeout for all LLM providers (seconds).
# Applies to OpenAI / Claude / Gemini / DeepSeek / Ollama / OpenRouter /
# openai_compatible. Allowed range: 10..600. Default 300s.
timeout = 300
# 新实例请直接在桌面设置页创建。手工配置时复制下面的完整表，
# 给每个渠道一个稳定且唯一的 ID，再把 ID 加进 default_chain：
#
# [llm.instances.relay-backup]
# name = "备用中转"
# provider_type = "openai_compatible"
# enabled = true
# api_key = ""
# model = "gpt-5-nano"
# base_url = "https://relay.example.com/v1"
# api_flavor = ""
#
# default_chain = ["deepseek", "relay-backup"]

[llm.instances.deepseek]
name = "DeepSeek 官方"
provider_type = "deepseek"
enabled = true
# 当前位于 default_chain，api_key 必填
api_key = ""
# 可选模型：deepseek-v4-flash（默认） / deepseek-v4-pro
# 旧名 deepseek-chat / deepseek-reasoner 将于 2026/07/24 弃用
model = "deepseek-v4-flash"
base_url = "https://api.deepseek.com"
# v4 thinking 默认用均衡档 medium（DeepSeek 官方兼容映射为 high）。
# 渠道的关键词、抽取、评分和短文案任务仍按单次调用传空并关闭 thinking；
# 需要最深推理时可改为 "max"，完全关闭可改为 ""。
reasoning_effort = "medium"

[llm.embedding]
# Embedding model for semantic similarity (topic dedup, fatigue, feedback)
#
# v0.3.32+ note: this section now owns its own ``api_key`` / ``base_url``.
# Embedding is fully decoupled from ``[llm].default_chain`` — pick the
# embedding provider, supply its credentials here, and chat traffic keeps
# using the ordered endpoint instances in ``[llm].default_chain``.
#
# provider: empty = disable embedding; embedding does not implicitly follow the chat chain
#           "ollama" = local Ollama (no API key needed)
#           "openai" / "gemini" = remote embeddings
# model:    matched to provider when empty:
#             gemini → gemini-embedding-001
#             openai → text-embedding-3-small
#             ollama → bge-m3   (multilingual, ~1.1GB, sub-second on CPU)
#
# To enable local Ollama embedding:
#   1. install Ollama   (Mac: `brew install ollama` ; Windows: ollama.com/download)
#   2. `ollama pull bge-m3`
#   3. set `provider = "ollama"` here, or run `openbiliclaw setup-embedding`
provider = ""
# Leave model empty so the registry picks the provider-appropriate default.
# Hardcoding "gemini-embedding-001" here used to break OpenAI / Ollama paths
# (the model name only exists on Gemini's API; other backends 404 on it).
# v0.3.20+ note: the registry's per-provider defaults are
#   gemini → gemini-embedding-001
#   openai → text-embedding-3-small
#   ollama → bge-m3
model = ""
# v0.3.32+: dedicated embedding credentials. Empty values only borrow the
# first matching enabled [llm.instances.*] endpoint when fallback_enabled=true
# (back-compat; emits a one-time WARNING). Ollama doesn't need an api_key.
# base_url is optional for Ollama (defaults to localhost), OpenAI
# (defaults to api.openai.com), and Gemini (defaults to the official API).
api_key = ""
base_url = ""
# Target embedding vector dimension. Default 1024 matches local Ollama bge-m3.
# Set 0 only when you intentionally want the provider's native default.
output_dimensionality = 1024
# Cosine similarity threshold: topics above this are considered "same topic"
similarity_threshold = 0.82
# 默认关闭 embedding fallback；只有 fallback_provider 非空时才会尝试一个显式备选 provider。
# 设置页会在你选择备选 provider 时同步打开 fallback_enabled，以允许借用首个同类型已启用实例的凭据。
# 请确保主备 embedding 模型输出维度/向量空间兼容，避免相似度结果漂移。
fallback_enabled = false
fallback_provider = ""
# Optional cover image embedding (image-only vectors, same space as text).
# Requires a multimodal embedding model, e.g.:
#   provider = "gemini"    model = "gemini-embedding-2"
#   provider = "dashscope" model = "qwen3-vl-embedding"  # 阿里百炼原生多模态向量
#     api_key = "sk-..."   # or env DASHSCOPE_API_KEY
#     base_url = ""        # default https://dashscope.aliyuncs.com
#     # output_dimensionality = 1024  # qwen3-vl: 2560/2048/1536/1024/768/512/256
# Default off — local ollama/bge-m3 and text-only remote models skip images.
# Independent of [discovery].multimodal_evaluation_enabled (vision LLM eval).
multimodal_enabled = false

# Per-module routes. inherit=true 表示完整继承 [llm].default_chain；
# 需要隔离质量/成本时改为 false，并按优先级填写实例 ID。

[llm.routes.soul]
# Soul profile generation / incremental updates (init, role/values/core delta)
inherit = true
chain = []

[llm.routes.discovery]
# Content discovery (search query generation, domain exploration)
inherit = true
chain = []

[llm.routes.recommendation]
# Recommendation expression generation
inherit = true
chain = []

[llm.routes.evaluation]
# Content relevance evaluation (LLM-as-judge for discovered content)
inherit = true
chain = []

[bilibili]
# Authentication method: "cookie" | "qrcode" | "none"
# 仅允许以上取值；非法值会在运行态校验时报错。
auth_method = "cookie"
# Cookie string (from browser)
cookie = ""
# B站 请求专用代理（默认留空 = 恒直连）。
# 后端访问 B站 时会忽略环境变量和系统代理——代理出口 IP 常触发 B站 风控，
# 导致明明已登录却显示"未登录"。只有你的网络确实无法直连 B站 时才需要填，
# 例如 "http://127.0.0.1:7890"。
proxy = ""

[bilibili.browser]
# agent-browser executable path (leave empty for global install)
executable = ""
# Use headed mode for debugging
headed = false

# ── 海外网络路由（仅作用于海外客户端）──
# 作用范围：OpenAI / Claude / Gemini / DeepSeek / OpenRouter / openai_compatible
# 的 chat + embedding、YouTube(yt-dlp)、X(twitter-cli)、Reddit(rdt-cli /
# OpenCLI)、Bangumi(api.bgm.tv 与封面 CDN lain.bgm.tv 均为海外 Cloudflare,
# 国内网络直连易超时,需走代理)、GitHub 自动更新、Codex OAuth。
# X / Reddit 回落到浏览器扩展任务时仍由浏览器自己的网络设置决定。
# B站 / 抖音 / Ollama 等国内直连请求始终直连,不受此项影响。
# system(默认) = 继承环境 / 系统代理；direct = 忽略环境 / 系统代理；
# custom = 只使用下方 proxy。
# 默认给 system,是因为上面列的全是海外服务:direct 下国内网络必然超时,
# 而这是开箱默认值——新用户配好令牌、启用来源,然后撞上一句没头没尾的
# 网络错误。没有配代理时 system 与直连等价,海外用户无影响。
# 支持 http:// | https:// | socks5:// | socks5h://,例如 "socks5://127.0.0.1:1080"。
[network]
mode = "system"
proxy = ""

# ── 通用 Web / 自定义网页源的浏览器配置 ──
# 与 [bilibili.browser] 独立：Bilibili 走 agent-browser CLI，
# 小红书 / 抖音当前走 Chrome 插件任务，不依赖这里。
[sources.browser]
# 预先启动一个 Chrome 监听 CDP 端口，可复用现有登录态；
# 仅在通用 Web / 自定义网页源需要登录态时填写：
#   chrome --remote-debugging-port=9222 --user-data-dir=$HOME/.openbiliclaw-chrome
# 然后在浏览器里登录目标网页源。留空则回落到 agent-browser（无登录态）。
cdp_url = ""
# agent-browser 回落路径是否使用 headed 模式
headed = false

# ── Bilibili discovery 开关 ──
# 设为 false 后：B 站 search / related_chain / trending / explore 不再参与后台 discovery，
# pool_source_shares 中的 bilibili 配额会被丢弃。
[sources.bilibili]
enabled = true

# ── 小红书（xhs）专用配置 ──
# 内容发现和元数据提取完全由浏览器扩展在真实登录态下完成：
# 被动收集（用户浏览时自动提取）+ 后台标签页搜索 + 创作者订阅。
# 后端不做主动爬取，避免触发风控。
[sources.xiaohongshu]
# 设为 false 后：跳过 init 的 XHS bootstrap，后端不再生成 XHS 搜索任务，
# pool_source_shares 中的 xiaohongshu 配额会被丢弃（不会让池子卡在低于目标）。
# 默认 false；init 交互式提示选 Yes、--yes-xhs 或插件设置页打开后才会写回 true。
enabled = false
# 每天后端允许入队的 Soul 驱动搜索任务数上限；0 表示不设每日上限，
# 仅受平台缺口、每轮 discovery_limit 与任务节流控制。
daily_search_budget = 0
# 每天订阅创作者抓取任务上限；0 表示不设每日上限。
daily_creator_budget = 0
# 扩展分发器两次任务之间的最小间隔（秒），进一步降低风控风险
task_interval_seconds = 45

# ── 抖音（Douyin）direct-cookie discovery 专用配置 ──
# 初始化画像仍走浏览器扩展；这里仅控制可选的后台内容发现。
# Cookie 优先读下方环境变量；未设置时会使用浏览器扩展同步到 data/douyin_cookie.json 的值。
# 不要把真实 Cookie 写进 config.toml。
# daily_*_budget 为每日任务上限；0 表示不设每日上限，仅受平台缺口、
# 每轮 discovery_limit、producer 节流与 request_interval_seconds 控制。
[sources.douyin]
enabled = false
mode = "direct"
cookie_env = "OPENBILICLAW_DOUYIN_COOKIE"
daily_search_budget = 0
daily_hot_budget = 0
daily_feed_budget = 0
request_interval_seconds = 2

# ── YouTube 专用配置 ──
# enabled=false 时 pool_source_shares 中的 youtube 配额会被丢弃（避免池子卡在低于目标）。
# YouTube steady-state discovery 由后端 producer 独立调度 yt_search / yt_trending / yt_channel。
# 下面的 daily_*_budget 按天限制各策略执行规模；0 表示不设每日上限，
# 每轮执行规模由平台缺口和 scheduler.discovery_limit 决定。
# bootstrap 画像导入仍走浏览器扩展 yt_tasks。
[sources.youtube]
enabled = false
daily_search_budget = 0
daily_trending_budget = 0
daily_channel_budget = 0
request_interval_seconds = 2
# YouTube producer 两次执行之间的最小间隔；0 表示每个 refresh tick 都允许检查执行。
min_interval_minutes = 60

# ── X (Twitter) 专用配置 ──
# 设为 false 后：后端不再生成 X 搜索/推荐流/账号订阅任务，
# pool_source_shares 中的 twitter 配额会被丢弃（避免池子卡在低于目标）。
# 默认 false，由 init 交互 / --yes-x / 插件设置页打开后才写回 true。
# 发现走服务端 cookie 重放（对标 douyin direct），cookie 经浏览器扩展自动同步
# 落盘 data/x_cookie.json，可被 OPENBILICLAW_X_COOKIE env 覆盖。
[sources.twitter]
enabled = false
mode = "cookie"                         # 服务端 cookie 重放
cookie_env = "OPENBILICLAW_X_COOKIE"    # 优先级高于 data/x_cookie.json
daily_search_budget = 0                 # 0 = 不设每日上限
daily_feed_budget = 0                   # 推荐流(For You)每日拉取上限（高曝光，建议压低）
daily_creator_budget = 0                # 账号订阅每日抓取上限
request_interval_seconds = 3            # 两次请求最小间隔（抗检测）
min_interval_minutes = 60               # producer 两次执行最小间隔

# ── 知乎（Zhihu）专用配置 ──
# 事件拉取和 discovery 都走浏览器插件登录态任务：后端只入队 zhihu_tasks，
# 插件在已登录 zhihu.com 标签页中执行 bootstrap_events 或 search / hot / feed / creator / related。
# enabled=false 时 pool_source_shares 中的 zhihu 配额会被丢弃。
[sources.zhihu]
enabled = false
source_modes = ["search", "hot", "feed", "creator", "related"]
daily_search_budget = 0                 # 搜索 discovery 每日任务上限，0 = 不设每日上限
daily_hot_budget = 0                    # 热榜 discovery 每日任务上限，0 = 不设每日上限
daily_feed_budget = 0                   # 首页推荐 discovery 每日任务上限，0 = 不设每日上限
daily_creator_budget = 0                # 作者页 discovery 每日任务上限，0 = 不设每日上限
daily_related_budget = 0                # 相关扩展 discovery 每日任务上限，0 = 不设每日上限
request_interval_seconds = 3            # 后端等待任务时的轮询间隔 / 插件搜索节奏提示
min_interval_minutes = 60               # ZhihuDiscoveryProducer 两次执行最小间隔

# ── Reddit 专用配置 ──
# Reddit 当前没有稳定免登录 API；日常 discovery 默认走随 OpenBiliClaw 安装的 rdt-cli 登录态命令后端。
# 初始化 saved/upvoted/subscribed 事件仍走 OpenBiliClaw 插件登录态。
# 已连接插件会把 reddit.com 的 reddit_session 自动同步到 rdt-cli credential store；
# 若插件不可用，也可在已登录 Reddit 的本机浏览器环境里手动运行：rdt login
# backend=rdt 使用 rdt-cli；extension 使用本插件；opencli / auto 为兼容选项。
# rdt / opencli 不可用时，discovery 会自动 fallback 到已登录插件任务。
# enabled=false 时 pool_source_shares 中的 reddit 配额会被丢弃。
[sources.reddit]
enabled = false
backend = "rdt"
source_modes = ["search", "hot", "subreddit", "related"]
daily_search_budget = 300               # 搜索 discovery 每日条目上限
daily_hot_budget = 300                  # 热门 discovery 每日条目上限
daily_subreddit_budget = 300            # subreddit discovery 每日条目上限
daily_related_budget = 300              # 相关扩展 discovery 每日条目上限
request_interval_seconds = 3            # 插件任务轮询间隔 / 命令 fallback 超时估算
min_interval_minutes = 60               # RedditDiscoveryProducer 两次执行最小间隔

# ── Bangumi 官方公开 API（只读）──
# 无需 Cookie 或 OAuth。username 留空时只参与后续内容发现；填写后，首次初始化可读取
# 该账号的公开收藏。latest 是兼容配置名，实际为按日期浏览，可能包含未播出的未来条目。
[sources.bangumi]
enabled = false
username = ""
# Optional personal access token. Generate one (valid ~1 year) at
# https://next.bgm.tv/demo/access-token. When set, init/discovery identify your
# account via /v0/me and read your OWN collections — including PRIVATE ones —
# with a Bearer header; the username above is auto-resolved. Leave empty to keep
# the anonymous public-username path (only reads public collections). Treat this
# token like a password; it is written to config.toml (which is gitignored).
access_token = ""
subject_types = ["anime", "book", "game"]
source_modes = ["search", "ranked", "latest"]
daily_search_budget = 300
daily_ranked_budget = 100
daily_latest_budget = 100
request_interval_seconds = 1
min_interval_minutes = 60
bootstrap_limit = 300

[scheduler]
# Enable scheduled content discovery
enabled = true
# Optional cost-saving guard for daemon-owned background LLM / embedding work.
# When true, refresh / pool precompute / account sync / speculation / proactive
# push only run while the browser extension has an active runtime-stream
# connection, plus the grace window below after the last disconnect.
# Manual CLI/API requests remain explicit and are not blocked by this switch.
pause_on_extension_disconnect = false
extension_disconnect_grace_seconds = 90
# Legacy compatibility field. The current runtime does not consume this cron;
# discovery is driven by the refresh loop, pool deficits, event thresholds, and
# per-strategy refresh intervals below.
discovery_cron = "0 */8 * * *"
# Keep at least this many fresh candidates ready in the discovery pool
# Allowed range: 1..600; each single refresh will backfill at most 60
pool_target_count = 300
# Low-frequency account sync interval for history / favorites / following
account_sync_interval_hours = 6
# --- Runtime refresh tuning ---
refresh_check_interval_seconds = 60      # Main loop poll interval; values <15 fallback
signal_event_threshold = 6               # New behavior events before search+related refresh
trending_refresh_hours = 3               # Minimum interval for trending strategy
explore_refresh_hours = 12               # Minimum interval for explore strategy
discovery_limit = 30                     # Per discovery wave limit; allowed range 1..60
delight_queue_limit = 20                 # Surprise queue load size for desktop/mobile/extension; 1..100
proactive_push_interval_seconds = 120    # Delight/probe push loop interval; values <30 fallback
speculator_idle_interval_minutes = 30    # Idle interval before checking speculation lifecycle
# --- 画像整理（ProfileConsolidator）库存水位 ---
profile_consolidation_enabled = true
profile_consolidation_interval_hours = 12
# active likes 超过 upper 时，定时整理会临时开 full boundary，并在合并后把低权重长尾
# 归档到 archived_interests，直到 active likes 降到 soft（或至少低于 upper）。
profile_consolidation_like_target_upper = 512
profile_consolidation_like_target_soft = 450
profile_consolidation_archive_enabled = true
# --- 猜测兴趣（Speculative Interest）调度 ---
# speculation_interval_minutes = 10   # 猜测推测运行间隔（分钟）
# speculation_ttl_days = 3            # 猜测兴趣默认存活天数
# speculation_cooldown_days = 7       # 被否定后的冷却天数
# speculation_confirmation_threshold = 3  # 确认猜测需要的正向信号数
# speculation_max_active = 5          # 最多同时活跃的猜测兴趣
# speculation_max_primary_interests = 15  # 主要兴趣域上限
# speculation_max_secondary_interests = 60  # 次要兴趣域上限
# --- 不喜欢领域探针（Speculative Avoidance）调度 ---
# avoidance_speculation_interval_minutes = 10  # 避雷方向推测运行间隔（分钟）
# avoidance_speculation_ttl_days = 3           # 避雷方向默认存活天数
# avoidance_speculation_cooldown_days = 7      # 被否定后的冷却天数
# avoidance_speculation_confirmation_threshold = 3  # 确认避雷方向需要的显式负向信号数
# avoidance_speculation_max_active = 5         # 最多同时活跃的避雷方向
# --- 自动更新 ---
auto_update_enabled = false        # 是否自动检查并应用后端新版本（默认关闭）
auto_update_check_interval_hours = 6  # 检查间隔（小时）
auto_update_allow_prerelease = false  # 是否允许 backend-vX.Y.Z-rc/beta/dev 预发布 tag
auto_update_allowed_remotes = [
  "https://github.com/whiteguo233/OpenBiliClaw.git",
  "git@github.com:whiteguo233/OpenBiliClaw.git",
] # 只有 origin 匹配这些远端时才允许自动快进（.git 后缀可省、HTTPS/SSH 拼法等价、大小写
  # 不敏感）；带凭据的 URL 一律拒绝；走 GitHub 镜像克隆的安装把镜像 URL 加进来即可

[scheduler.pool_source_shares]
# Candidate-pool source mix by platform family. The saved default 5:1:1:1:1:1
# keeps B 站 as the main source when optional platforms are enabled.
# 关掉的源（[sources.<name>].enabled = false）的配额会被自动剔除，剩余
# 源按比例重新归一化吃满 pool_target_count——所以这里写多少不重要，重要的
# 是源本身的 enabled 开关。
bilibili = 5
xiaohongshu = 1
douyin = 1
youtube = 1
twitter = 1
zhihu = 1
reddit = 1
bangumi = 1

# ── 统一关键词规划器 / Discover 背压 (P1) ──
# 把"每平台各自定时调 LLM 生成搜索词"换成缺口拉动的双缓冲背压模型：一个关键词
# 存储（cache + 历史 + 产出）夹在生成与抓取之间，生成只在缓存见底且池子有真实
# 缺口时触发（一次合并 LLM 调用覆盖所有缺货平台，带历史去重）。v0.3.124 起默认
# 开启；设为 false 可逐字回退到旧逐平台生成路径。
# 注意：抓取最小间隔(fetch_floor)复用各平台已有的 min_interval，这里没有该字段。
[discovery]
# 统一关键词规划器总开关。true（默认，v0.3.124+）= 走 planner + 存储；false = 回退旧逐平台搜索词生成。
unified_keyword_planner_enabled = true
# 每平台关键词缓存高/低水位。pending < low 且有真实缺口时生成，补到 high。
kw_cache_high = 30
kw_cache_low = 10
# 单平台单次合并 LLM 调用生成的关键词数。
gen_batch = 30
# 单次原子领取(claim)的关键词数。
fetch_batch = 5
# 去重窗口：最近最多这么多个关键词、且在这么多小时内的，作为"别再出"喂给 planner。
history_window_size = 150
history_window_hours = 48
# 领取租约（分钟）：claimed/executing 超过这个时长未变会被回收成 pending。
claim_lease_minutes = 10
# 关键词规划器轮询间隔（秒）；空闲轮询近似零成本。
planner_poll_seconds = 120
# 兜底失效（小时）：即便画像 digest 未变，pending 关键词超过这个时长也会过期。
plan_ttl_hours = 12
# 统一推荐池入池最低分。来源/插件 observed 标签不能绕过该门槛。
admission_min_score = 0.6
# 可选 query inspiration 脑暴。默认关闭；开启后 planner 会通过本机 mcporter 调用
# 搜索 provider 链获取预览，再由 discovery.keyword_inspiration 生成带溯源 metadata 的搜索词。
inspiration_search_enabled = false
# 搜索后端按顺序尝试。默认先用 local_cache 复用本地 content_cache evidence；
# 本地证据不足时再用已启用的平台源做 inspiration-only grounding（当前同步支持
# B站 / YouTube / X / Reddit，抖音 direct client；小红书 / 知乎 bridge 可用时
# 也会加入；不写候选池），再用 Exa；Exa 免费 MCP 限流 / 返回空时再用
# You.com 免费 MCP profile 兜底。远端 MCP 需要在本机 mcporter 配置里有
# `exa` 和 / 或 `you` server。
inspiration_search_backends = ["local_cache", "platform_sources", "exa", "you"]
# 实验开关：开启且 inspiration provider 可用时，跳过旧 merged keyword planner，
# 每轮 due 平台只用 inspiration flow 产词。
inspiration_replace_merged_keywords = false
# 探索广度档位：low / medium / high。medium 与旧默认逐项等值；十个旧的
# inspiration_* 细粒度旋钮（aspect_window_size / interest_sample_size /
# max_probe_searches_per_stage / platforms_per_probe / riskcontrolled_probe_budget /
# search_pages_per_probe / search_results_per_query / max_seeds_per_aspect /
# max_expansions_per_seed / max_keywords_per_platform）已移除，写了也会被忽略
# 并在启动提示中给出迁移说明。
inspiration_breadth = "high"
# 候选评估期望并发，合法范围 1..3；每个 worker 最多 30 条，因此最多 90 条
# raw 候选在途。运行时会为聊天等交互保留一个全局 LLM 槽位，因此有效并发为
# min(本值, max(1, llm.concurrency - 1))。
candidate_eval_concurrency = 3
# 可选封面图评估。默认关闭；开启后 discovery evaluator 会在模型支持图像输入时
# 把已压缩的候选封面一并送入评估器，模型不支持时自动退回纯文本评估。
multimodal_evaluation_enabled = false
# 用户视觉画像（P1）：把点赞/踩过的视频封面聚成口味质心，按候选封面↔质心相似度
# 给排序加一个独立的小幅 bonus（正向加分、负向即"标题党封面"降权）。
# 需 [llm.embedding].multimodal_enabled + 多模态嵌入模型；与上面的图文评估互相独立。
# 默认关闭；关闭或无反馈数据时排序与原路径字节一致。
visual_profile_enabled = false
# 视频关键帧加成（P3）：封面是 UP 主手选的营销图、常常标题党，不代表视频内容。
# B 站已为每个视频预生成关键帧雪碧图（进度条悬停预览），一次请求即可取到，
# 无需下载视频、无需 ffmpeg。用 P1 建好的口味质心去匹配真实画面而非封面。
# 需 [llm.embedding].multimodal_enabled + 多模态嵌入模型；仅对 B 站视频有效。
keyframe_enabled = false
# 每个视频采样的关键帧数（合法范围 1..12）。相邻关键帧高度冗余，4 帧已能覆盖正片。
keyframe_max_frames = 4
# 每轮预热处理的视频数上限（合法范围 1..200）。
keyframe_fetch_limit = 50
# 弹幕文本增强（P2）：B 站候选喂给推荐的语义只有 title + description，而 description
# 常是"求三连"之类的无信息文本。弹幕是 B 站独有信号，反映观众实际在讨论什么。
# 抓取后做降噪清洗（压缩刷屏、剔除"难说/已取餐/666"这类高频梗，按压缩后长度取长弹幕
# ——实测高频弹幕语义价值为零，真正有信息的是低频长弹幕），再嵌入为独立排序信号。
# 纯文本信号，无需多模态嵌入模型；仅对 B 站视频有效。
danmaku_enabled = false
# 每轮预热处理的视频数上限（合法范围 1..200）。
danmaku_fetch_limit = 50
# 弹幕摘要字数上限（合法范围 100..2000）。
danmaku_max_chars = 500
# 图文评估每轮 batch 上限。图像输入成本更高，合法范围 1..12。
multimodal_batch_size = 8
# 封面图压缩参数：最大边、JPEG 质量、单图抓取/压缩超时秒数。
multimodal_image_max_px = 384
multimodal_image_quality = 72
multimodal_image_timeout_seconds = 6

[autostart]
# 登录系统后是否自动拉起 OpenBiliClaw 后端。默认关闭；请通过设置页或
# `openbiliclaw autostart enable` 开启，以便同步注册/反注册 OS 自启动项。
enabled = false
# 当 LLM / embedding 使用本机 Ollama 时，后端启动时顺带确保 `ollama serve`
# 已运行。仅管理本机 127.0.0.1:11434，远端 Ollama 不会被拉起。
manage_ollama = true

[saved_sync]
# 同步外部平台收藏的总开关；默认关闭，需由用户明确开启。
auto_sync_enabled = false

[storage]
# SQLite database path
db_path = "data/openbiliclaw.db"

[logging]
# Console log level: DEBUG | INFO | WARNING | ERROR
level = "INFO"
# File log level, usually more verbose than console
file_level = "DEBUG"
# Log directory (relative to project root by default)
directory = "logs"
# Log file name inside the directory above
filename = "openbiliclaw.log"
# Rotate the active log when it exceeds this many MB (0 disables rotation).
# 启动时如果文件已经超过这个值，会把旧文件重命名为 <filename>.1 后重新开始。
# v0.3.30+ 默认从 1024 (1 GB) 降到 100 MB —— 长跑 daemon 1 GB 太大,占盘。
max_file_size_mb = 100
# Number of rotated backups to keep alongside the active file.
# 设为 1 → 磁盘占用封顶在 `max_file_size_mb * 2` MB。
backup_count = 1
# v0.3.30+ logs/ 目录里 *unmanaged* 文件(start 脚本 stdout redirect /
# 一次性 init 日志 / 旧版本残留)的总磁盘预算 MB。启动时如果整个 logs/
# 目录(含 unmanaged)超过这个值,从最老的 unmanaged 文件开始删,直到回到
# 预算内。设 0 关闭。也可以手动跑 `openbiliclaw logs-prune --apply`。
aggregate_budget_mb = 500
# 单个 unmanaged 日志文件超过这个 MB 数,启动时直接 truncate 到 0。
# 抓 backend-restart.log 这类被脚本无限 append 但项目代码控制不到的文件。
# 设 0 关闭。
unmanaged_truncate_mb = 200
# logs/ 目录里超过这个天数的 *unmanaged* 文件,启动时直接删除。设 0 关闭。
unmanaged_max_age_days = 30

[soul.preference]
# v0.3.x event-satisfaction signal.
# When true, preference analysis ignores passive negative events such as
# quick_exit (clicked then bounced in <5s). Explicit dislike feedback is
# retained as disliked_topics evidence instead of being learned as a
# positive interest.
satisfaction_filter_enabled = true
