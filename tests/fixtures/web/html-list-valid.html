<!doctype html>
<html lang="en">
  <head>
    <title>Example newsroom</title>
    <link rel="alternate" type="application/rss+xml" href="/feeds/news.xml" />
    <link rel="alternate" type="application/atom+xml" href="https://feeds.example.com/all.atom" />
  </head>
  <body>
    <ul class="list-news">
      <li class="entry">
        <h2><a class="headline" href="/news/alpha?mc_cid=tracker"><span>Alpha</span> launch</a></h2>
        <p class="summary">A small, useful launch.</p>
        <span class="byline">Dana</span>
        <time datetime="2026-08-10T09:00:00+08:00">August 10</time>
      </li>
      <li class="entry">
        <h2><a class="headline" href="https://news.example.com/news/beta">Beta launch</a></h2>
        <p class="summary">A second launch.</p>
        <span class="byline">Eve</span>
        <time datetime="unknown">someday</time>
      </li>
      <li class="entry">
        <a class="headline" href="https://outside.example/news/nope">Not allowed</a>
      </li>
    </ul>
  </body>
</html>
